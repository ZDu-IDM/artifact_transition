name: Run migration

# Manual only — never on push. Pick a phase/type and whether it's a dry run.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase to run"
        type: choice
        options: [discover, inventory, report, verify, publish, run, cleanup]
        default: discover
      type:
        description: "Artifact type"
        type: choice
        options: [all, pypi, docker, npm, data]
        default: all
      dry_run:
        description: "Dry run (log actions, change nothing)"
        type: boolean
        default: true
      image:
        description: "docker only: restrict to images matching these substrings (comma-sep)"
        type: string
        default: ""

permissions:
  contents: write      # create / delete GitHub Releases (pypi, data)
  packages: write      # publish npm + push ghcr images

concurrency:
  group: migration     # never run two migrations at once
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
      ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
      ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
      # A PAT with write:packages (+ delete:packages for cleanup) if provided,
      # otherwise the built-in token (fine for releases + publishing).
      GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure npm auth (GitHub Packages)
        run: echo "//npm.pkg.github.com/:_authToken=${GH_TOKEN}" > ~/.npmrc

      - name: Log in to ghcr.io
        run: echo "${GH_TOKEN}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Artifactory Docker login is handled inside the toolkit per-repo using the
      # subdomain registry (<repo>.packages.idmod.org) — the plain root is misconfigured.

      # publish / verify / cleanup / report read manifests that `inventory`
      # writes; a fresh runner has none, so inventory the type first. (`run`
      # and `inventory` already do it themselves.)
      - name: Inventory (prerequisite)
        if: ${{ inputs.phase != 'inventory' && inputs.phase != 'run' && inputs.phase != 'discover' }}
        run: python migrate.py inventory --type ${{ inputs.type }} --image "${{ inputs.image }}"

      - name: Run migrate.py ${{ inputs.phase }} --type ${{ inputs.type }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAG=--dry-run
          else
            FLAG=--yes          # bypass the interactive guard in CI
          fi
          python migrate.py ${{ inputs.phase }} --type ${{ inputs.type }} $FLAG \
            --image "${{ inputs.image }}"

      - name: Generate report
        if: ${{ always() && inputs.phase != 'report' }}
        run: python migrate.py report || true

      - name: Upload manifests + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-${{ inputs.phase }}-${{ inputs.type }}
          path: |
            manifests/
            report/
          if-no-files-found: ignore

      # Persist the resume ledger so published status is visible in every checkout
      # (incl. the GUI) and the next run resumes from it. state.json is tracked;
      # dry-runs and read-only phases don't change it, so this no-ops for them.
      - name: Commit updated state.json
        if: ${{ always() && github.ref_type == 'branch' }}
        run: |
          if git diff --quiet -- manifests/state.json; then
            echo "state.json unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/state.json
          git commit -m "ci: update migration state.json (${{ inputs.phase }} ${{ inputs.type }}) [skip ci]"
          # Rebase onto any concurrent change before pushing (concurrency group
          # already serializes migration runs, so this is just belt-and-suspenders).
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"
